name: CRO Quality Gate

on:
  schedule:
    # Daily at 03:15 UTC
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CRO quality gate
        run: npm run cro:quality-gate

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cro-quality-gate-${{ github.run_id }}
          path: docs/reports/cro-quality-gates/
          if-no-files-found: warn
          retention-days: 14
