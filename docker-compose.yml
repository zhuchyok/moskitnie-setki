services:
  # API Gateway (image: при деплое подставляется из tar, иначе собирается из build)
  api:
    container_name: "${SETKI21_API_CONTAINER_NAME:-setki21-api-new}"
    image: moskit-api:latest
    mem_limit: 1g
    build:
      context: .
      dockerfile: moskit-api/Dockerfile
    # 8083 снаружи: 8081 часто занят atra-web-ide-gateway
    ports:
      - "8083:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_URL=${DATABASE_URL:-postgres://moskit:password@postgres:5432/moskit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PORT=${PORT:-8080}
    volumes:
      - "${SETKI21_UPLOADS_PATH:-/home/atra/setki21_uploads}:/app/uploads"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - default

  # Frontend (Nuxt)
  # Для продакшена (VDS) при сборке ОБЯЗАТЕЛЬНО NUXT_PUBLIC_API_URL=https://www.setki21.ru — иначе в бандле apiUrl=localhost → мерцание/белый экран.
  web:
    container_name: "${SETKI21_WEB_CONTAINER_NAME:-setki21-web-new}"
    mem_limit: 1g
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-https://www.setki21.ru}
    ports:
      - "3003:3000"
    environment:
      - API_URL=${API_URL:-http://setki21-api-new:8080}
      - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL:-https://www.setki21.ru}
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://setki21-api-new:8080/api}
      # Тот же SMTP, что и для заказов сеток (Timeweb и др.): на VDS задать в .env
      - SMTP_HOST=${SMTP_HOST:-smtp.timeweb.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-info@setki21.ru}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default

  # PostgreSQL
  postgres:
    container_name: setki21-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: moskit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moskit
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis
  redis:
    container_name: setki21-redis
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Nginx
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/letsencrypt:ro
  #   depends_on:
  #     - web
  #     - api
  #   restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: setki21_src_default
    driver: bridge
